[package]
name = "miniquant"
version = "0.1.0"
edition = "2021"
description = "Build a quantization library from scratch in Rust"
authors = ["You"]
license = "MIT"

[dependencies]
ndarray = "0.15"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false
